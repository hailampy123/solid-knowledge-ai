    <h1>How Orcas Communicate</h1>
    <p>Orcas use clicks, whistles, and pulsed calls to communicate within their pod.
    Each pod has a distinct dialect of calls passed down across generations.</p>
    <p>These vocal traditions help researchers tell different pods apart.</p>
